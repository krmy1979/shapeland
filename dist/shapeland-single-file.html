<title>Shapeland</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&family=Dancing+Script:wght@700&display=swap">
<style>
/* Layout: full-bleed 3D world (island, bridge, town, house interiors); toy-like HUD floats on top; panels slide up from the bottom */
:root{
  --sky:#9FD6FF; --ink:#1D2A48; --muted:#56668A; --card:#FFFFFF; --line:#C9DCF3; --soft:#EEF5FF;
  --berry:#EE4F7C; --berry-dk:#C23560; --sun:#FFB41F; --sun-dk:#D88C00; --sun-ink:#5E3B00;
  --gem:#19B8C9; --gem-dk:#0E8795; --leaf:#1F9E60; --leaf-soft:#DAF5E6; --bad:#D9443F; --bad-soft:#FCE2E1;
  --f-display:"Fredoka","Varela Round",Arial,sans-serif; --f-body:"Varela Round","Fredoka",Arial,sans-serif; --f-sign:"Dancing Script","Brush Script MT",cursive;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.en{direction:ltr;unicode-bidi:isolate;font-family:var(--f-display);font-weight:600}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.hud{position:fixed;pointer-events:none;z-index:5}
.hud>*{pointer-events:auto}
#hudTop{top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline:max(12px,env(safe-area-inset-left,0px));display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.chip{background:var(--card);border-radius:999px;box-shadow:0 3px 0 rgba(29,42,72,.18);display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border:0}
.chip svg{width:38px;height:38px;border-radius:50%;background:var(--soft);flex:none}
.chip b{font-family:var(--f-display);font-size:15px;display:block;line-height:1.1;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip small{font-size:11px;color:var(--muted)}
.lvbar{width:70px;height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:2px}
.lvbar i{display:block;height:100%;background:var(--berry)}
.gems{background:var(--gem);color:#fff;font-family:var(--f-display);font-weight:700;font-size:17px;padding:7px 14px;border-radius:999px;box-shadow:0 3px 0 var(--gem-dk);font-variant-numeric:tabular-nums;border:0;white-space:nowrap}
.topcol{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.loc{background:rgba(29,42,72,.82);color:#fff;border:0;border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.friends{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fr{background:rgba(255,255,255,.92);border:0;border-radius:999px;display:flex;align-items:center;gap:5px;padding:3px 10px 3px 3px;font-size:13px;box-shadow:0 2px 0 rgba(29,42,72,.15);max-width:150px}
.fr svg{width:28px;height:28px;border-radius:50%;background:var(--soft);flex:none}
.fr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);flex:none}
.fr .where{font-size:11px;color:var(--muted)}
.net{font-size:12px;background:rgba(255,255,255,.85);border-radius:999px;padding:4px 10px;color:var(--muted)}
.quest{background:var(--sun);color:var(--sun-ink);border:0;border-radius:16px;padding:7px 12px;font-size:14px;box-shadow:0 3px 0 var(--sun-dk);display:flex;gap:8px;align-items:center;max-width:min(330px,62vw);text-align:start}
.quest .en{font-size:14px}
.quest b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
#hudBot{bottom:calc(env(safe-area-inset-bottom,0px) + 10px);inset-inline:max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;align-items:center}
.bar{display:flex;gap:4px;background:rgba(255,255,255,.95);border-radius:22px;padding:6px;box-shadow:0 4px 0 rgba(29,42,72,.18);max-width:100%;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.tool{border:0;background:transparent;border-radius:16px;min-width:52px;padding:6px 5px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--muted);flex:none}
.tool span{font-size:22px;line-height:1}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff}
.tool.go{background:var(--sun);color:var(--sun-ink)}
.tray{background:rgba(255,255,255,.96);border-radius:20px;padding:8px;box-shadow:0 4px 0 rgba(29,42,72,.18);width:min(560px,100%);display:flex;flex-direction:column;gap:7px}
.scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.shp{border:2px solid transparent;background:var(--soft);border-radius:14px;min-width:58px;padding:4px 4px 3px;display:flex;flex-direction:column;align-items:center;font-size:10px;position:relative;flex:none}
.shp svg{width:28px;height:28px}
.shp .em{font-size:24px;line-height:28px}
.shp .n{position:absolute;top:1px;inset-inline-start:4px;font-size:10px;font-weight:700;color:var(--berry)}
.shp[aria-pressed="true"]{border-color:var(--ink);background:#fff}
.shp.lock{opacity:.45}
.shp.lock::after{content:"🔒";position:absolute;top:0;inset-inline-end:2px;font-size:11px}
.col{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);flex:none}
.col[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.trow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sz{border:2px solid var(--line);background:#fff;border-radius:12px;padding:4px 9px;font-size:12px}
.sz[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.cost{font-size:12px;color:var(--muted);margin-inline-start:auto}
.tip{font-size:13px;color:var(--muted);text-align:center}
.btn{border:0;border-radius:16px;padding:12px 18px;font-family:var(--f-display);font-weight:600;font-size:17px;background:var(--berry);color:#fff;box-shadow:0 4px 0 var(--berry-dk);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--berry-dk)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.gem{background:var(--gem);box-shadow:0 4px 0 var(--gem-dk)}
.btn.sun{background:var(--sun);color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-dk)}
.btn.mini{padding:7px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
h2{font-family:var(--f-display);font-size:22px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:0}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(29,42,72,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet-in.still{animation:none}
.sheet-in{background:#fff;width:100%;max-width:600px;max-height:88%;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.npchead{display:flex;gap:12px;align-items:center}
.npchead .face{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:34px;flex:none}
.npchead .face svg{width:50px;height:50px}
.bubble{background:var(--soft);border-radius:18px 18px 18px 4px;padding:12px 14px;font-size:19px;line-height:1.35}
.spk{border:0;background:var(--sun);color:var(--sun-ink);border-radius:999px;padding:7px 14px;font-family:var(--f-display);font-weight:600;box-shadow:0 3px 0 var(--sun-dk)}
.spk.huge{font-size:38px;width:92px;height:92px;padding:0;border-radius:50%}
.hint{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:#fff;border-radius:18px;padding:13px 10px;font-size:18px;box-shadow:0 4px 0 var(--line);min-width:0;overflow-wrap:anywhere}
.opt .pic{font-size:42px;line-height:1.1;display:block}
.opt.ok{border-color:var(--leaf);background:var(--leaf-soft);box-shadow:0 4px 0 var(--leaf)}
.opt.no{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 4px 0 var(--bad)}
.pz{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pz .pic{font-size:62px;line-height:1.1}
.pz .word{font-size:28px}
.built{min-height:58px;border:2px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;direction:ltr;width:100%}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:ltr}
.tile{border:0;background:var(--soft);border-radius:12px;padding:10px 13px;font-family:var(--f-display);font-weight:600;font-size:19px;box-shadow:0 4px 0 var(--line);min-width:44px}
.tile.used{visibility:hidden}
.tile.in{background:var(--sun);color:var(--sun-ink);box-shadow:0 3px 0 var(--sun-dk)}
.fb{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--leaf-soft)} .fb.no{background:var(--bad-soft)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:8px 12px}
.list b{font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{color:var(--leaf)} .minus{color:var(--bad)}
.big{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:var(--soft);border-radius:16px;padding:12px}
.pbar{height:14px;background:var(--soft);border-radius:9px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--gem);transition:width .4s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ochip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;align-items:center;font-size:13px;line-height:1.2;position:relative}
.ochip .en{font-size:11px;color:var(--muted)}
.ochip svg{width:30px;height:30px}
.ochip[aria-pressed="true"]{border-color:var(--berry);background:#FFE8EF}
.ochip.lock{opacity:.6}
.ochip .tag{font-size:10px;color:var(--sun-dk);font-weight:700}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--berry)}
.slider{display:flex;align-items:center;gap:10px;font-size:14px}
.slider input{flex:1;accent-color:var(--berry)}
.preview{display:flex;justify-content:center}
.preview svg{width:min(190px,48vw);height:auto}
input.txt{font:inherit;font-family:var(--f-display);font-size:18px;border:2px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;background:var(--soft);color:var(--ink);text-align:center;-webkit-user-select:text;user-select:text}
.timer{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;width:100%}
.dots i{flex:1;height:8px;border-radius:9px;background:var(--soft)}
.dots i.ok{background:var(--leaf)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--berry)}
/* shop */
.goods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.good{border:2px solid var(--line);background:#fff;border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;position:relative}
.good .em{font-size:30px;line-height:1.1}
.good .en{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.good .pr{font-family:var(--f-display);color:var(--gem-dk);font-weight:700;font-variant-numeric:tabular-nums}
.good.lock{opacity:.5}
.good .q{position:absolute;top:4px;inset-inline-end:6px;background:var(--berry);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
.cart{background:var(--soft);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.cart .line{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.cnt>div{background:var(--soft);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cnt .em{font-size:30px}
.cnt .ctl{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:18px}
.cnt .ctl button{border:0;background:#fff;border-radius:50%;width:28px;height:28px;box-shadow:0 2px 0 var(--line);font-weight:700}
.receipt{font-family:"Courier New",monospace;background:#FFFDF5;border:2px dashed #E5D9B6;border-radius:12px;padding:12px;font-size:14px;direction:ltr;text-align:left}
.receipt div{display:flex;justify-content:space-between;gap:14px}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mapgrid button{border:0;border-radius:20px;padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--f-display);font-size:17px;box-shadow:0 4px 0 rgba(29,42,72,.15)}
.mapgrid button .ic{font-size:36px}
/* title */
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;overflow-y:auto;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),linear-gradient(#7CC7FF,#B9E4FF 55%,#9BE0A3);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.tcard{width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.logo{font-family:var(--f-display);font-weight:700;font-size:clamp(46px,14vw,72px);line-height:.9;letter-spacing:1px;direction:ltr;display:flex;margin-top:6px}
.logo span{display:inline-block;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-8px) rotate(-4deg)}}
.sig{font-family:var(--f-sign);font-size:clamp(28px,8vw,38px);color:var(--ink);direction:ltr;margin-top:-4px}
.sig small{font-family:var(--f-display);font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;opacity:.65;margin-inline-end:8px;vertical-align:middle}
.tform{background:rgba(255,255,255,.92);border-radius:26px;padding:16px;width:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 rgba(29,42,72,.15)}
.tform label{font-size:13px;color:var(--muted);text-align:start}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;z-index:70;max-width:calc(100% - 32px);font-size:15px;text-align:center;animation:up .2s ease-out}
.burst{position:fixed;inset:0;z-index:65;pointer-events:none;display:grid;place-items:center}
.burst div{font-family:var(--f-display);font-weight:700;font-size:44px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;animation:pop 1.6s ease-out forwards;text-align:center}
@keyframes pop{0%{transform:scale(.3);opacity:0}20%{transform:scale(1.15);opacity:1}70%{transform:scale(1)}100%{transform:scale(1) translateY(-40px);opacity:0}}
@media (max-width:420px){.tool{min-width:46px}.tool span{font-size:20px}.chip b{max-width:80px}.goods{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="stage"></div>

<div id="hudTop" class="hud" dir="rtl" hidden>
  <div class="topcol">
    <div class="row" style="gap:8px">
      <button class="chip" data-a="avatar" id="meChip" aria-label="הדמות שלי"></button>
      <button class="gems" data-a="bank" id="gemPill" aria-label="יהלומים"></button>
    </div>
    <button class="loc" data-a="map" id="locChip"></button>
    <div id="questChip"></div>
  </div>
  <div class="friends" id="friends"></div>
</div>

<div id="hudBot" class="hud" dir="rtl" hidden>
  <div class="tray" id="tray" hidden></div>
  <div class="bar" role="toolbar" aria-label="כלים" id="bar"></div>
</div>

<div id="title" dir="rtl">
  <div class="tcard">
    <div class="logo" aria-label="Shapeland" id="logo"></div>
    <div class="sig"><small>a world by</small>Shirel Yitzhak</div>
    <div class="preview" id="titleAv"></div>
    <div class="tform">
      <label for="tName">איך קוראים לדמות שלך?</label>
      <input class="txt" id="tName" dir="auto" maxlength="14" placeholder="שם במשחק">
      <label for="tCode">קוד החבורה (כל מי שמשתמש באותו קוד משחק ביחד)</label>
      <input class="txt en" id="tCode" dir="ltr" maxlength="24" placeholder="shirel-friends" autocapitalize="none" autocomplete="off" spellcheck="false">
      <button class="btn" data-a="play" style="font-size:22px">יאללה, לשחק! ✨</button>
      <button class="btn ghost mini" data-a="avatar">🎨 לעצב את הדמות</button>
    </div>
  </div>
</div>

<div id="sheet" class="sheet" dir="rtl" hidden></div>
<div id="toast" class="toast" dir="rtl" hidden></div>
<div id="burst" class="burst" hidden></div>

function shape2D(k){const s=new THREE.Shape();
  if(k==='heart'){s.moveTo(0,-.5);s.bezierCurveTo(-.1,-.36,-.56,-.12,-.5,.16);s.bezierCurveTo(-.44,.46,-.08,.5,0,.24);s.bezierCurveTo(.08,.5,.44,.46,.5,.16);s.bezierCurveTo(.56,-.12,.1,-.36,0,-.5)}
  else if(k==='star'){for(let i=0;i<10;i++){const a=Math.PI/2+i*Math.PI/5,r=i%2?.24:.56;i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r)}}
  else if(k==='moon'){s.absarc(0,0,.5,.35*Math.PI,1.65*Math.PI,false);s.absarc(.2,0,.45,1.547*Math.PI,.453*Math.PI,true)}
  return s}
const GEO={},HEIGHT={};
function geo(k){if(GEO[k])return GEO[k];let g;
  if(k==='ball')g=new THREE.SphereGeometry(.5,24,18);else if(k==='box')g=new THREE.BoxGeometry(.96,.96,.96);
  else if(k==='cone')g=new THREE.ConeGeometry(.5,1.1,24);else if(k==='cylinder')g=new THREE.CylinderGeometry(.45,.45,1,24);
  else if(k==='pyramid'){g=new THREE.ConeGeometry(.66,1,4);g.rotateY(Math.PI/4)}else if(k==='donut')g=new THREE.TorusGeometry(.36,.15,12,28);
  else if(k==='arch')g=new THREE.TorusGeometry(.42,.14,10,24,Math.PI);else if(k==='diamond'){g=new THREE.OctahedronGeometry(.5);g.scale(1,1.25,1)}
  else if(k==='cloud'){g=new THREE.SphereGeometry(.5,16,12);g.scale(1.1,.6,.8)}
  else g=new THREE.ExtrudeGeometry(shape2D(k),{depth:.3,bevelEnabled:true,bevelThickness:.06,bevelSize:.05,bevelSegments:2,curveSegments:16});
  g.computeBoundingBox();g.center();g.computeBoundingBox();HEIGHT[k]=g.boundingBox.max.y-g.boundingBox.min.y;GEO[k]=g;return g}
function shapeMesh(k,col){const hex=COLS[col]?COLS[col][0]:col;const o={};if(k==='diamond')Object.assign(o,{metalness:.35,roughness:.18});if(k==='star'||k==='moon')Object.assign(o,{emissive:hex,emissiveIntensity:.18});
  if(k==='cloud'){const g=new THREE.Group();[[0,0,0,.5],[-.42,-.05,0,.36],[.42,-.06,0,.38],[.15,.18,.05,.34]].forEach(([x,y,z,r])=>{const m=mesh(new THREE.SphereGeometry(r,16,12),mat(hex,o));m.position.set(x,y,z);g.add(m)});return g}
  return mesh(geo(k),mat(hex,Object.keys(o).length?o:undefined))}

function npcHead(id,extra){const n=NPCS.find(x=>x.id===id);return`<div class="npchead"><div class="face" style="background:${n.color}33">${n.face}</div><div class="grow"><h2>${en(n.name)}</h2><p class="sub">${n.role}</p></div>${extra||''}</div>`}
const gemTag=()=>`<span class="gems" style="box-shadow:none">💎 ${fmt(P.gems)}</span>`;

/* --- Bella --- */
function genQuest(){const r=P.sk.vocab,t=tierFor(r);const owned=P.owned;const s=pick(owned.length>4&&Math.random()<.6?owned.slice(4):owned);
  const c=pick(Object.keys(COLS));const c2=pick(Object.keys(COLS).filter(x=>x!==c));
  const n=clamp([0,rnd(1,3),rnd(2,4),rnd(3,5),rnd(3,6),rnd(4,7)][t],1,7);const sz=t>=2&&Math.random()<.5?pick(['small','big']):null;const high=t>=3&&Math.random()<.35;
  const sw=n===1?s:SHAPES[s].pl,szw=sz?sz+' ':'';let text;
  if(t===1)text=`Build ${nw(n)} ${c} ${sw}, please!`;
  else if(t===2)text=`Can you build ${nw(n)} ${szw}${c} ${sw}?`;
  else if(t===3)text=high?`I need ${nw(n)} ${c} ${sw}. Put ${n===1?'it':'them'} up high, above three meters!`:`Please build ${nw(n)} ${szw}${c} ${sw} for my garden.`;
  else if(t===4)text=high?`The birds want ${nw(n)} ${szw}${c} ${sw} high in the sky, above three meters. Can you help?`:`My little brother loves the color ${c}. Could you make ${nw(n)} ${szw}${sw} for him?`;
  else text=`We are decorating for a party. Build ${nw(n)} ${szw}${sw}${high?' above three meters':''}, but they must be ${c}, not ${c2}!`;
  const he=`${n} × ${SHAPES[s].he} · צבע ${COLS[c][1]}${sz?' · גודל '+SIZES[sz][1]:''}${high?' · גבוה מ־3 מטר':''} · אפשר באי או בבית`;
  return{text,he,s,c,sz,high,n,start:Date.now(),reward:6+t*3+(high?3:0),short:`${nw(n)} ${szw}${c} ${sw}${high?' ↑':''}`,hint:false}}
function questProgress(q){const d=P.pieces.concat(P.house.pieces,P.cpieces).filter(p=>p.ts>=q.start&&p.s===q.s&&p.c===q.c&&(!q.sz||p.sz===q.sz)&&(!q.high||p.y-hOf(p.s,p.sz)/2>=3)).length;return[Math.min(d,q.n),q.n]}
function checkQuest(){const q=P.quest;if(!q)return;const[d,n]=questProgress(q);renderQuestChip();if(d>=n){
  P.quest=null;learnResult('vocab',true);if(!q.hint)P.sk.vocab=clamp(P.sk.vocab+.25,1,10);addGems(q.reward,'משימה של Bella','Quest reward');addXp(30);sfx.win();burst('🎉 +'+q.reward+' 💎');
  say(pick(['Thank you! It looks amazing!','Wow, you did it! Great job!','Perfect! You are a real builder!']));adventure();renderQuestChip();setNpcMarks()}}
function openBella(){PANEL='bella';const q=P.quest;
  if(q){sheet(`${npcHead('bella')}<div class="bubble">${en(q.text)}</div><div class="row"><button class="spk" data-a="sayt" data-t="${esc(q.text)}">🔊</button><button class="btn ghost mini" data-a="qhint">💡</button></div>
    <div class="hint" id="qh" ${q.hint?'':'hidden'}>${esc(q.he)}</div><p class="sub">התקדמות: ${questProgress(q).join('/')}</p>
    <div class="row"><button class="btn" data-a="close">${en("I'm on it!")}</button><button class="btn ghost mini" data-a="dropq">לוותר על המשימה</button></div>`);say(q.text);return}
  const nq=genQuest();PANEL_DATA=nq;

    <div class="row"><button class="spk" data-a="sayt" data-t="${esc(nq.text)}">🔊</button><button class="btn ghost mini" data-a="nqhint">💡</button></div>
    <div class="hint" id="qh" hidden>${esc(nq.he)}</div><p class="sub">פרס: 💎${nq.reward} · מה עונים לה?</p>
    <div class="opts one"><button class="opt" data-a="takeq">${en("Sure! I'll build it!")}</button><button class="opt" data-a="close">${en('Maybe later.')}</button></div>`);
  say('Hi '+spName()+'! '+nq.text)}

/* --- Leo --- */
function pricePuzzle(price,r){const d=clamp(Math.round(r),1,10);let e,h;
  if(d<=2){const a=rnd(1,price-1);e=`It costs ${a} + ${price-a} gems.`;h=`המחיר: ${a} ועוד ${price-a}`}
  else if(d<=4){const fs=[2,3,4,5,6].filter(f=>price%f===0&&price/f>1);if(fs.length){const f=pick(fs);e=`It costs ${nw(f)} times ${price/f} gems.`;h=`המחיר: ${f} כפול ${price/f}`}else{const a=rnd(2,price-2);e=`It costs ${price+a} minus ${a} gems.`;h=`המחיר: ${price+a} פחות ${a}`}}
  else if(d<=6){const f=pick([2,3]);const b=Math.floor(price/f),c=price-b*f;e=c?`${f} × ${b} + ${c} gems.`:`${f} × ${b} gems.`;h=`${f} כפול ${b}${c?' ועוד '+c:''}`}
  else if(d<=8){const opts=[[50,2],[25,4/3],[20,5/4],[10,10/9]].filter(([pc,m])=>Number.isInteger(price*m));if(opts.length){const[pc,m]=pick(opts);const o=price*m;e=`It was ${o} gems. Today it's ${pc}% off!`;h=`היה ${o}, היום ${pc}% הנחה`}else{const have=price+rnd(5,30);e=`You have ${have} gems. After you buy it, you will have ${have-price} left. What is the price?`;h=`יש ${have}, אחרי הקנייה נשאר ${have-price}`}}
  else{const have=price+rnd(10,60);e=`You have ${have} gems. After you buy it, you will have ${have-price} gems left. What is the price?`;h=`יש ${have}, אחרי הקנייה נשאר ${have-price}`}
  return{e,h,opts:numOpts(price),ans:String(price)}}
function openShop(focus){PANEL='leo';const L=level();const items=Object.entries(SHAPES).filter(([k])=>!P.owned.includes(k));
  sheet(`${npcHead('leo',gemTag())}<div class="bubble">${en(items.length?'Welcome to my magic shape shop! What would you like?':'You have every shape! Amazing!')}</div>
    <div class="chips">${items.map(([k,v])=>`<button class="ochip ${L<v.lvl?'lock':''}" data-a="buyshape" data-v="${k}" aria-pressed="${focus===k}">${shapeIcon(k,L<v.lvl?'#A9B6CC':'#8B5CF6')}<span class="en">${k}</span><span class="tag">${L<v.lvl?'🔒 Level '+v.lvl:'💎?'}</span></button>`).join('')}</div>
    <p class="sub">המחיר אצל Leo הוא תמיד חידה קטנה. פותרים, ואז משלמים.</p><button class="btn ghost" data-a="close">${en('Bye, Leo!')}</button>`);
  say(items.length?'Welcome to my magic shape shop!':'You have every shape!')}
function buyShape(k){const v=SHAPES[k];if(level()<v.lvl){toast(`ה־${k} נפתח ב־Level ${v.lvl}`);return}PANEL='leobuy';PANEL_DATA={k,pz:pricePuzzle(v.price,P.sk.math),wrong:null};renderBuy()}

/* --- generic puzzle (Mia, chests) --- */
function openMia(){PANEL='mia';USED=new Set();openPuzzle({head:npcHead('mia'),q:qTalk(P.sk.talk),reward:4,onDone:ok=>{if(ok)adventure()}})}
function openChest(g){PANEL='chest';USED=new Set();const type=pick(['vocab','listen','spell','sentence','math','vocab','listen']);

function openPuzzle(o){PZ=Object.assign({answered:null,built:[],said:false},o);renderPZ();if(PZ.q.sayFirst)setTimeout(()=>say(PZ.q.sayFirst),250)}
function fbBlock(q,A){return`<div class="fb ${A.ok?'ok':'no'}"><h3>${A.ok?pick(['יש! 🎉','מעולה! ⭐','בול! 🎯']):'כמעט! ככה זה:'}</h3><div style="font-size:18px">${en(q.showAns)}${q.heAns?`<div class="sub">${esc(q.heAns)}</div>`:''}</div>
    ${!A.ok&&q.note?`<p class="sub">${esc(q.note)}</p>`:''}
    ${q.talk&&A.ok?`<p class="sub"><b>עכשיו להגיד את זה בקול!</b></p><div class="row"><button class="spk" data-a="sayans">🔊</button>${PZ.said?'<span class="plus">🎤 +1 💎</span>':'<button class="btn sun mini" data-a="said">🎤 אמרתי!</button>'}</div>`:(q.sayAfter?`<div class="row"><button class="spk" data-a="sayans">🔊</button></div>`:'')}</div>`}
function renderPZ(){if(!PZ)return;if(PZ.race)return renderRace();if(PZ.series)return renderSeries();const q=PZ.q,A=PZ.answered;let h=PZ.head+`<div class="pz">${q.prompt}</div>`+qBody(q,A);
  if(A)h+=fbBlock(q,A)+(A.ok?`<p class="plus" style="margin:0;font-family:var(--f-display);font-size:18px">+${PZ.reward} 💎</p>`:'')+`<button class="btn" data-a="pzdone">המשך</button>`;sheet(h)}
function qBody(q,A){if(q.type==='choice')return`<div class="opts ${q.one?'one':''}">${q.opts.map((o,i)=>{let c='';if(A){if(o.val===q.ans)c='ok';else if(o.val===A.picked)c='no'}
    return`<button class="opt ${c}" data-a="opt" data-i="${i}" ${A?'disabled':''} ${o.aria?`aria-label="${esc(o.aria)}"`:''}>${o.html}</button>`}).join('')}</div>`;
  if(q.type==='counter')return`<div class="cnt">${q.menu.map((it,i)=>`<div><span class="em">${it[1]}</span>${en(it[0])}<div class="ctl"><button data-a="cminus" data-i="${i}" ${A?'disabled':''} aria-label="פחות">−</button><span>${PZ.counts[i]}</span><button data-a="cplus" data-i="${i}" ${A?'disabled':''} aria-label="עוד">+</button></div></div>`).join('')}</div>
    ${A?'':`<button class="btn" data-a="serve">${en('Serve')} 🧺</button>`}`;
  const B=PZ.built;return`<div class="built">${B.map((ti,k)=>`<button class="tile in" data-a="untile" data-k="${k}" ${A?'disabled':''}>${esc(q.tokens[ti])}</button>`).join('')}</div>
    <div class="tiles">${q.tokens.map((t,i)=>`<button class="tile ${B.includes(i)?'used':''}" data-a="tile" data-i="${i}" ${A?'disabled':''}>${esc(t)}</button>`).join('')}</div>
    ${A?'':`<div class="row" style="justify-content:center"><button class="btn" data-a="check" ${B.length?'':'disabled'}>✓</button><button class="btn ghost" data-a="clearb">↺</button></div>`}`}
function answerPZ(ok,picked){const q=PZ.q;PZ.answered={ok,picked};learnResult(q.skill,ok,q.word);
  if(ok){sfx.coin();if(PZ.reward&&!PZ.series)addGems(PZ.reward,PANEL==='chest'?'תיבת אוצר':'שיחה באנגלית',PANEL==='chest'?'Treasure':'Chat');addXp(PZ.race?5:PZ.series?8:15)}else sfx.bad();
  if(q.sayAfter)setTimeout(()=>say(q.sayAfter),220);
  if(PZ.race){raceAnswer(ok);return}if(PZ.series){PZ.series.res.push(ok);renderSeries();return}renderPZ()}

/* --- jobs (series) --- */
function qCashier(r){const t=tierFor(r);const n=clamp(t>=3?rnd(2,3):rnd(1,2),1,3);const items=shuffle(GOODS.filter(g=>g.tr<=t+1)).slice(0,n).map(g=>({g,q:t>=4?rnd(1,3):1}));
  const total=items.reduce((s,x)=>s+x.g.price*x.q,0);const askTotal=r<3.2;const note=[5,10,20,50,100].find(v=>v>total)||100;
  const list=items.map(x=>goodPh(x.g.en,x.q));
  const line=askTotal?`Hello! I want ${listEn(list)}. How much is it?`:`Hi! I'll take ${listEn(list)}. Here are ${note} gems.`;
  const ans=askTotal?total:note-total;
  return{type:'choice',skill:'math',sayFirst:line,prompt:`<div class="bubble" style="width:100%;text-align:start">${en(line)}</div>
    <div class="list" style="width:100%">${items.map(x=>`<div class="cart"><div class="line"><span>${x.g.em} ${en(x.g.en)}${x.q>1?' ×'+x.q:''}</span><b>💎 ${x.g.price}${x.q>1?' × '+x.q:''}</b></div></div>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="spk" data-a="sayq">🔊</button><button class="btn ghost mini" data-a="hint">💡</button></div>
    <div class="hint" id="hintTxt" hidden>${askTotal?'מחברים את כל המחירים':`קודם מחברים את המחירים (${total}), ואז ${note} פחות הסכום`}</div><p class="sub">${askTotal?'כמה זה עולה בסך הכל?':'כמה עודף מחזירים?'}</p>`,
    opts:numOpts(ans),ans:String(ans),showAns:(askTotal?'Total: ':'Change: ')+ans+' gems',sayAfter:askTotal?`That's ${ans} gems, please.`:`Here is your change: ${ans} gems. Thank you!`}}
function qBaker(r){const t=tierFor(r);const k=clamp(t>=4?3:t>=2?2:1,1,3);const chosen=shuffle(PASTRY).slice(0,k);const counts=chosen.map(()=>rnd(1,Math.min(5,t+1)));
  const ph=(it,c)=>`${nw(c)} ${c===1?it[2]:it[3]}`;const parts=chosen.map((it,i)=>ph(it,counts[i]));let line;
  if(t===1)line=`${parts[0][0].toUpperCase()+parts[0].slice(1)}, please!`;else if(t===2)line=`Can I have ${listEn(parts)}, please?`;
  else if(t===3)line=`Good morning! I'd like ${listEn(parts)}.`;else if(t===4)line=`Hello! I need ${parts[0]} for my party, and ${listEn(parts.slice(1))} for my family.`;
  else line=`Hi! Please give me ${parts[0]}. Oh, and ${listEn(parts.slice(1))}, too. Thanks!`;
  const menu=shuffle(PASTRY.filter(p=>!chosen.includes(p))).slice(0,6-k).concat(chosen);const order=shuffle(menu);const want=order.map(it=>{const i=chosen.indexOf(it);return i<0?0:counts[i]});
  return{type:'counter',skill:'listen',sayFirst:line,menu:order,want,prompt:`<div class="bubble" style="width:100%;text-align:start">${r>=7?`<span id="npcTxt" hidden>${en(line)}</span><span id="npcHid">🎧 …</span>`:en(line)}</div>
    <div class="row" style="justify-content:center"><button class="spk" data-a="sayq">🔊</button>${r>=7?'<button class="btn ghost mini" data-a="reveal">👀</button>':''}</div>`,
    showAns:line,sayAfter:'Thank you! It smells delicious!'}}
function startShift(kind){const r=kind==='cashier'?P.sk.math:P.sk.listen;USED=new Set();const qs=[0,1,2,3].map(()=>kind==='cashier'?qCashier(r):qBaker(r));
  PANEL='job';PZ={series:{kind,qs,i:0,res:[]},answered:null,built:[],counts:null,q:qs[0]};prepQ();renderSeries();if(PZ.q.sayFirst)setTimeout(()=>say(PZ.q.sayFirst),300)}
function prepQ(){PZ.answered=null;PZ.built=[];if(PZ.q.type==='counter')PZ.counts=PZ.q.menu.map(()=>0)}
const JOBINFO={cashier:{en:'Cashier',he:'קופאי/ת במכולת',face:'🧾',per:3},baker:{en:'Baker',he:'אופה במאפייה',face:'🧑‍🍳',per:4}};
function renderEscape(){const S=PZ.series;
  if(S.failed){sheet(`<div class="pz"><div class="pic">⏰</div><h2>${en('Time is up!')}</h2><p class="sub">${S.i} מתוך 3 מנעולים נפתחו. אפשר לנסות שוב מתי שרוצים.</p></div><button class="btn" data-a="escfail">חזרה</button>`);return}
  if(S.i>=S.qs.length){const rw=25+level()*2;sheet(`<div class="pz"><div class="pic">🗝️🎉</div><h2>${en('You escaped!')}</h2><p class="sub">כל 3 המנעולים נפתחו בזמן</p></div><button class="btn" data-a="escdone" data-v="${rw}">${en('Collect')} 💎${rw}</button>`);return}
  const q=PZ.q,A=PZ.answered;let h=`<div class="row"><h2 class="grow">🔐 ${en('Lock '+(S.i+1)+' of 3')}</h2><span class="timer" id="escT">⏱️</span></div><div class="dots">${S.qs.map((_,i)=>`<i class="${i<S.i?'ok':i===S.i?'cur':''}"></i>`).join('')}</div><div class="pz">${q.prompt}</div>`+qBody(q,A);
  if(A)h+=fbBlock(q,A)+`<button class="btn" data-a="nextcust">${A.ok?(S.i+1>=3?en('Open the door!'):en('Next lock!')):en('Try another riddle')}</button>`;sheet(h)}

  if(S.i>=S.qs.length){const good=S.res.filter(Boolean).length;const pay=5+good*J.per+level();sheet(`<div class="pz"><div class="pic">${J.face}</div><h2>${en('Shift complete!')}</h2><p class="sub">${good} מתוך ${S.qs.length} לקוחות מרוצים</p>
      <div class="receipt"><div><span>PAYSLIP · ${esc(J.en)}</span><span></span></div><div><span>Base</span><span>${5+level()}</span></div><div><span>Happy customers × ${J.per}</span><span>${good*J.per}</span></div><div><b>Salary</b><b>${pay} gems</b></div></div></div>
      <button class="btn" data-a="shiftdone" data-v="${pay}">${en('Get paid')} 💎</button>`);return}
  const q=PZ.q,A=PZ.answered;let h=`<div class="npchead"><div class="face" style="background:var(--soft)">${J.face}</div><div class="grow"><h2>${en(J.en)}</h2><p class="sub">${J.he} · ${en('Customer')} ${S.i+1}/${S.qs.length}</p></div></div>
    <div class="dots">${S.qs.map((_,i)=>`<i class="${i<S.res.length?(S.res[i]?'ok':'no'):i===S.i?'cur':''}"></i>`).join('')}</div><div class="pz">${q.prompt}</div>`+qBody(q,A);
  if(A)h+=fbBlock(q,A)+`<button class="btn" data-a="nextcust">${S.i+1>=S.qs.length?'סיום המשמרת':en('Next customer!')}</button>`;sheet(h)}

/* --- team --- */
function teamGoal(){return TEAM[P.team%TEAM.length]}
function teamReward(){return 20+Math.floor(P.team/TEAM.length)*10}
function checkTeam(){const[d,n]=teamGoal().prog(allIsland());if(d>=n){const rw=teamReward();P.team++;addGems(rw,'משימת צוות','Team mission');addXp(40);sfx.win();
  burst('TEAMWORK! 🤝');say('Teamwork! Mission complete!');adventure();save()}if(PANEL==='team')openTeam(true)}
function openTeam(silent){PANEL='team';const g=teamGoal();const[d,n]=g.prog(allIsland());
  const by=new Map();by.set(P.key,P.pieces.length);OTHERS.forEach((m,k)=>by.set(k,m.size));
  const helpers=[...by.entries()].filter(([,c])=>c>0).map(([k,c])=>`<li><span>${esc(k===P.key?(P.name||'את/ה')+' (את/ה)':(NET.names.get(k)||'חבר/ה'))}</span><b>${c} חלקים</b></li>`).join('');
  sheet(`<div class="npchead"><div class="face" style="background:#FFD34D55">🤝</div><div class="grow"><h2>${en("Shirel Yitzhak's World")}</h2><p class="sub">משימת צוות #${P.team+1} · כל מי שמחובר עוזר</p></div></div>
    <div class="bubble">${en(g.en)}</div><div class="row"><button class="spk" data-a="sayt" data-t="${esc(g.en)}">🔊</button><button class="btn ghost mini" data-a="hint">💡</button></div><div class="hint" id="hintTxt" hidden>${esc(g.he)}</div>
    <div class="pbar"><i style="width:${Math.round(d/n*100)}%"></i></div><p class="sub">${d} / ${n} · פרס לכל אחת: 💎${teamReward()}</p>
    ${helpers?`<h3>מי בנה על האי</h3><ul class="list">${helpers}</ul>`:''}<button class="btn" data-a="close">${en("Let's do it!")}</button>`);if(!silent)say(g.en)}

/* --- arena / race --- */

  else text=`My shopping list: ${listEn(list)}. Please don't buy anything else!`;

document.addEventListener('click',e=>{const sh=$('#sheet');if(e.target===sh&&!(PZ&&(PZ.race||PZ.series))){closeSheet();return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,d=b.dataset;
  KEEP=['mq','busans','cplus','cminus','tile','untile','clearb','addcart','rmcart','opt','check','serve','said','coans','pay','dep','wd','goal','sound'].includes(a);
  try{act(a,d)}finally{KEEP=false}});
function act(a,d){
  switch(a){
   case'play':{const nm=$('#tName').value.trim().slice(0,14);const code=($('#tCode').value.trim()||'shirel-friends').toLowerCase().replace(/\s+/g,'-');
     if(!CODE_RE.test(code)){toast('קוד החבורה באנגלית או מספרים בלבד, למשל shirel-friends');break}P.name=nm||P.name||'Player';P.code=code;save();
     $('#title').hidden=true;$('#hudTop').hidden=false;$('#hudBot').hidden=false;rebuildMe();renderHouse('home',P.house);clearScope('H');P.house.pieces.forEach(p=>addPieceObj(p,'H','home',P.furn));
     clearScope('W');P.ws.forEach(p=>addPieceObj(p,'W','work',P.furn));renderExteriors();teleport('island');renderHud();setNpcMarks();say("Welcome to Shirel Yitzhak's World, "+spName()+'!');connect();
     if(!P.adv)setTimeout(()=>toast('👷‍♀️ Bella מחכה לך עם משימה ראשונה! לגעת בה'),2500);break}
   case'mode':setMode(d.v);break;
   case'sel':SEL[d.k]=d.v;if(d.k==='s'&&!P.owned.includes(d.v))openShop(d.v);say(d.v);renderTray();break;

   case'hcolor':P.house.color=d.v;save();renderExteriors();pushPresence(true);renderTray();toast('צבע הבית מבחוץ השתנה 🎨');break;
   case'rot':SEL.r=(SEL.r+1)%8;toast('↻ '+SEL.r*45+'°');break;
   case'avatar':openAvatar();break;
   case'avdone':closeSheet();if(!$('#title').hidden){$('#titleAv').innerHTML=charSVG(P.ch);break}rebuildMe();renderHud();pushPresence(true);renderExteriors();break;
   case'ch':{if(ACC[d.v]&&!P.ward.includes(d.v)){say(d.t);toast(`${d.t} נמכר ב־Clothes Shop בעיירה 👗`);break}P.ch[d.k]=d.v;say(d.t);save();$('#pv').innerHTML=charSVG(P.ch);
     document.querySelectorAll(`[data-a="ch"][data-k="${d.k}"]`).forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===d.v));if(!$('#title').hidden)$('#titleAv').innerHTML=charSVG(P.ch);break}
   case'setpet':P.pet=d.v==='none'?null:d.v;save();rebuildPet();pushPresence(true);document.querySelectorAll('[data-a="setpet"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===d.v));if(P.pet)say(P.pet);break;
   case'bank':openBank(true);break;
   case'arena':openArena();break;
   case'settings':openSettings();break;
   case'map':openMap();break;
   case'goto':closeSheet();if(d.v==='visit'&&!(VISIT&&VISIT.house))break;teleport(d.v);if(d.v==='home'||d.v==='visit')sfx.door();if(d.v==='work')say('Welcome to the workshop! Build something new.');break;
   case'close':closeSheet();break;
   case'sayt':say(d.t);break;
   case'sayq':if(PZ&&PZ.q)say(PZ.q.sayFirst||PZ.q.sayText||PZ.q.sayAfter);break;
   case'sayans':if(PZ&&PZ.q)say(PZ.q.sayAfter);break;

   case'takeq':P.quest=PANEL_DATA;P.quest.start=Date.now();save();closeSheet();renderQuestChip();setNpcMarks();if(MODE!=='build'&&ME.zone!=='town')setMode('build');say("Great! Let's build!");break;
   case'dropq':P.quest=null;save();closeSheet();renderQuestChip();setNpcMarks();break;
   case'questinfo':openBella();break;
   case'mission':openKim();break;
   case'takemission':P.mission=PANEL_DATA;save();closeSheet();renderQuestChip();setNpcMarks();say('Thank you, dear!');break;

   case'buyshape':buyShape(d.v);break;
   case'pay':{const{k,pz}=PANEL_DATA;const o=pz.opts[+d.i];if(o.val!==pz.ans){PANEL_DATA.wrong=o.val;learnResult('math',false);sfx.bad();say("Hmm, that's not the right price. Try again!");renderBuy();break}
     const price=SHAPES[k].price;learnResult('math',true);if(P.gems<price){say("That's right! But you need more gems.");toast(`נכון! אבל חסרים ${fmt(price-P.gems)} 💎. אפשר למשוך מהבנק או לעבוד בעיירה`);break}
     P.gems-=price;P.owned.push(k);logm('קנייה: '+k,'Shopping',-price);SEL.s=k;save();sfx.win();burst(shapeIcon(k,'#fff').replace('<svg','<svg style="width:90px;height:90px"'));say('Here is your '+k+'! Have fun!');closeSheet();renderHud();setNpcMarks();
     if(ME.zone!=='town')setMode('build');break}
   case'opt':{if(!PZ||PZ.answered)break;const o=PZ.q.opts[+d.i];answerPZ(o.val===PZ.q.ans,o.val);break}
   case'tile':{if(!PZ||PZ.answered)break;const i=+d.i;if(!PZ.built.includes(i)){PZ.built.push(i);if(PZ.q.skill==='sentence')say(PZ.q.tokens[i]);renderPZ()}break}
   case'untile':PZ.built.splice(+d.k,1);renderPZ();break;
   case'clearb':PZ.built=[];renderPZ();break;
   case'check':{const q=PZ.q,got=PZ.built.map(i=>q.tokens[i]).join(q.joiner);answerPZ(got.toLowerCase()===q.target.join(q.joiner).toLowerCase(),got);break}
   case'cplus':PZ.counts[+d.i]=Math.min(9,PZ.counts[+d.i]+1);blip(600,.05);renderPZ();break;
   case'cminus':PZ.counts[+d.i]=Math.max(0,PZ.counts[+d.i]-1);blip(400,.05);renderPZ();break;
   case'serve':{const ok=PZ.q.want.every((w,i)=>w===PZ.counts[i]);answerPZ(ok,null);break}
   case'said':if(!PZ.said){PZ.said=true;addGems(1);renderPZ()}break;
   case'pzdone':{const cb=PZ.onDone,ok=PZ.answered&&PZ.answered.ok;closeSheet();if(cb)cb(ok);break}
   case'nextcust':{const S=PZ.series;if(S.kind==='escape'&&!(PZ.answered&&PZ.answered.ok)){USED=new Set();S.qs[S.i]=escQ();PZ.q=S.qs[S.i];prepQ();renderSeries();if(PZ.q.sayFirst)setTimeout(()=>say(PZ.q.sayFirst),250);break}S.i++;if(S.i<S.qs.length){PZ.q=S.qs[S.i];prepQ();renderSeries();if(PZ.q.sayFirst)setTimeout(()=>say(PZ.q.sayFirst),250)}else renderSeries();break}
   case'shiftdone':{const pay=+d.v;addGems(pay,'משכורת: '+JOBINFO[PZ.series.kind].he,'Salary');P.shifts++;addXp(20);adventure();sfx.coin();burst('💼 +'+pay+' 💎');say('Great work! Here is your salary.');closeSheet();break}
   case'race':closeSheet();startRaceLocal();break;
   case'job':openJob(d.v);break;
   case'shift':startShift(d.v);break;
   case'store':openStore(d.v);break;
   case'backstore':openStore(CART.store);break;
   case'addcart':{const it=storeItems(CART.store).find(x=>x.id===d.v);if(!it)break;if(it.own){toast('כבר יש לך את זה 🙂');break}if(it.lock){toast(`נפתח ב־Level ${it.lock}`);break}
     if(['clothes','pets'].includes(CART.store)&&CART.items[it.id])break;CART.items[it.id]=(CART.items[it.id]||0)+1;say(it.en);blip(700,.06);openStore(CART.store);break}
   case'rmcart':CART.items[d.v]=Math.max(0,(CART.items[d.v]||0)-1);openStore(CART.store);break;
   case'checkout':checkout();break;
   case'coans':{const D=PANEL_DATA;const o=D.opts[+d.i];if(o.val!==String(D.ans)){D.wrong=o.val;learnResult('math',false);sfx.bad();say("Hmm, let me check... that's not right. Try again!");renderCheckout();break}
     learnResult('math',true);payCart(D.lines,D.total);break}
   case'friend':{const p=NET.peers.find(x=>x.peer===d.p);if(!p)break;PANEL='friend';PANEL_DATA=p;const pr=p.presence||{};
     sheet(`<div class="npchead"><div class="face" style="background:var(--soft)">${charSVG(sanitizeCh(pr.ch))}</div><div class="grow"><h2>${esc(nameOf(p))}</h2><p class="sub">${en('Level '+clamp(+pr.lv||1,1,99))} · ${clamp(+pr.pc||0,0,999)} 🧱</p></div></div>
       <button class="btn" data-a="invite" data-p="${esc(p.peer)}">🔑 להזמין לבית שלי</button>
       <p class="sub">לשלוח ל${esc(nameOf(p))} משהו נחמד:</p><div class="row">${[['👋','Hi!'],['🎉','Great job!'],['⭐','Cool!'],['💖','You are awesome!']].map(([e,t])=>`<button class="btn ghost mini" data-a="wave" data-e="${e}">${e} ${en(t)}</button>`).join('')}</div>
       ${pr.zone==='island'||pr.zone==='town'||pr.zone==='city'?'<button class="btn gem" data-a="gofriend">ללכת אליו/ה 🚶</button>':''}<button class="btn ghost" data-a="close">סגירה</button>`);break}
   case'wave':{const p=PANEL_DATA;emit('wave',{to:p.peer,from:P.name,e:d.e});toast('נשלח! '+d.e);closeSheet();break}
   case'gofriend':{const pr=PANEL_DATA.presence||{};const z=pr.zone==='town'?'town':pr.zone==='city'?'city':'island';if(ME.zone!==z&&!(z!=='city'&&(ME.zone==='island'||ME.zone==='town')))teleport(z);
     const[cx,cz]=ZC[z];walkTo(new THREE.Vector3(cx+clamp(+pr.x||0,-14,14)+1,0,cz+clamp(+pr.z||0,-14,14)+1));setMode('walk');closeSheet();break}
   case'invite':{const peer=d.p;INVITED.add(peer);emit('invite',{to:peer,from:P.name,h:P.key});toast('🔑 ההזמנה נשלחה!');closeSheet();if(ME.zone!=='home')teleport('home');break}
   case'knock':{const p=PANEL_DATA;emit('knock',{to:p.peer,from:P.name});sfx.door();toast('🚪 דפקת בדלת. מחכים שיפתחו…');closeSheet();break}
   case'accept':{const D=PANEL_DATA;if(VISIT&&VISIT.host!==D.h)leaveVisit();VISIT={host:D.h,hostPeer:D.peer,name:D.who,house:null,defs:{},mine:new Set(),pending:true};emit('enter',{h:D.h,to:D.peer});toast('🔑 פותחים את הדלת…');closeSheet();break}
   case'mq':{const D=PANEL_DATA;const o=D.opts[+d.i];if(o.val!==String(D.ans)){D.wrong=o.val;learnResult('math',false);sfx.bad();say('Hmm, not quite. Try again!');renderMoneyQ();break}learnResult('math',true);D.onOk();break}
   case'plot':openPlot(d.v);break;
   case'buyplot':buyPlot(d.v,d.m);break;
   case'taketour':P.tour={dest:PANEL_DATA};save();closeSheet();renderQuestChip();setNpcMarks();say("Thank you! I will follow you.");if(MODE!=='walk')setMode('walk');break;
   case'droptour':P.tour=null;NPCOBJ.tom.position.set(CX+TOM_HOME[0],0,CZ+TOM_HOME[1]);save();closeSheet();renderQuestChip();setNpcMarks();break;
   case'tourinfo':openTom();break;
   case'saminfo':openSam();break;
   case'safetask':P.safeTask=true;save();closeSheet();renderQuestChip();setNpcMarks();say('Go to the crosswalk and wait for the green man.');break;
   case'safeq':closeSheet();openPuzzle({head:npcHead('sam'),q:qSafety(),reward:5,onDone:ok=>{if(ok){P.badges.safe++;save();setNpcMarks()}}});break;
   case'escape':closeSheet();startEscape();break;
   case'escdone':{const rw=+d.v;P.badges.escape++;addGems(rw,'חדר בריחה במגדל הים','Escape room');addXp(40);adventure();sfx.win();burst('🗝️ +'+rw+' 💎');say('You escaped! Amazing!');clearInterval(escTimer);closeSheet();break}
   case'escfail':clearInterval(escTimer);closeSheet();break;
   case'busans':{const D=PANEL_DATA;const o=D.opts[+d.i];if(o.val!==D.ans){D.wrong=o.val;learnResult('math',false);sfx.bad();say('Oh no, wrong time! Try again.');renderBus();break}learnResult('math',true);rideBus(D.dest);break}
   case'savefurn':openSaveFurn();break;
   case'fword':PANEL_DATA.word=d.v;say(d.v);document.querySelectorAll('[data-a="fword"]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===d.v));$('#sfBtn').disabled=false;break;
   case'dosavefurn':doSaveFurn();break;
   case'dep':{const amt=d.v==='all'?P.gems:Math.min(+d.v,P.gems);if(amt<=0){toast('אין יהלומים ביד');break}P.gems-=amt;P.savings+=amt;logm('הפקדה לבנק','Deposit',amt);sfx.coin();save();renderHud();openBank();break}
   case'wd':{const amt=d.v==='all'?P.savings:Math.min(+d.v,P.savings);if(amt<=0){toast('הבנק ריק');break}P.savings-=amt;P.gems+=amt;logm('משיכה מהבנק','Withdraw',-amt);save();renderHud();openBank();break}
   case'goal':P.goal=d.v;save();openBank();break;
   case'sound':P.sound=!P.sound;save();openSettings();break;
   case'tocode':closeSheet();$('#title').hidden=false;$('#hudTop').hidden=true;$('#hudBot').hidden=true;if(NET.room){NET.room.leave().catch(()=>{});NET.room=null}
     NET.avatars.forEach(a=>scene.remove(a.obj));NET.avatars.clear();OTHERS.forEach((m,o)=>clearScope(o));OTHERS.clear();OTHC.forEach((m,o)=>clearScope(o));OTHC.clear();if(VISIT)leaveVisit();NET.peers=[];NET.state='off';renderExteriors();break;
   case'reset':$('#resetBox').innerHTML='<div class="row"><span class="sub">בטוח? כל הבנייה וההתקדמות יימחקו.</span><button class="btn mini" data-a="reset2">כן, לאפס</button></div>';break;
   case'reset2':{try{localStorage.removeItem(KEY)}catch(e){}const k=P.key;[...OBJ.keys()].forEach(removePieceObj);OTHERS.clear();P=freshP();P.key=k;save();closeSheet();
     rebuildMe();renderHouse('home',P.house);renderExteriors();teleport('island');renderHud();setNpcMarks();toast('המשחק אופס');break}
  }}
document.addEventListener('input',e=>{if(e.target.id==='nm'){P.name=e.target.value.slice(0,14);save()}
  if(e.target.id==='sw'||e.target.id==='sh'){P.ch[e.target.id==='sw'?'w':'h']=+e.target.value;save();$('#pv').innerHTML=charSVG(P.ch)}});

/* ===================== LOOP ===================== */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
const clock=new THREE.Clock();const tmpV=new THREE.Vector3();
function loop(){const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  if(ME.obj){const tgt=ME.path[0];if(tgt){const dx=tgt.x-ME.pos.x,dz=tgt.z-ME.pos.z,dist=Math.hypot(dx,dz);
      if(dist<.08){ME.path.shift();const z=zoneAt(ME.pos.x,ME.pos.z);if(z&&z!=='bridge'&&z!==ME.zone&&(z==='island'||z==='town')){ME.zone=z;renderLoc();renderBar();renderTray()}}
      else{const st=Math.min(dist,4.6*dt);ME.pos.x+=dx/dist*st;ME.pos.z+=dz/dist*st;ME.obj.rotation.y=Math.atan2(dx,dz);ME.obj.position.y=Math.abs(Math.sin(t*12))*.12;pushPresence();
        const z=zoneAt(ME.pos.x,ME.pos.z);if((z==='island'||z==='town')&&z!==ME.zone){ME.zone=z;renderLoc();renderBar();renderTray()}}
      controls.target.lerp(tmpV.set(ME.pos.x,0,ME.pos.z),.05)}else ME.obj.position.y=0;
    ME.obj.position.x=ME.pos.x;ME.obj.position.z=ME.pos.z;
    if(ME.pet){const bx=ME.pos.x-Math.sin(ME.obj.rotation.y)*.9+Math.cos(ME.obj.rotation.y)*.6,bz=ME.pos.z-Math.cos(ME.obj.rotation.y)*.9-Math.sin(ME.obj.rotation.y)*.6;
      const dx=bx-ME.pet.position.x,dz=bz-ME.pet.position.z;const dd=Math.hypot(dx,dz);if(dd>12){ME.pet.position.set(bx,0,bz)}else if(dd>.05){ME.pet.position.x+=dx*.08;ME.pet.position.z+=dz*.08;ME.pet.rotation.y=Math.atan2(dx,dz);ME.pet.position.y=Math.abs(Math.sin(t*14))*.08}else ME.pet.position.y=0}}
  sun.position.set(controls.target.x+12,24,controls.target.z+10);sun.target.position.copy(controls.target);
  NET.avatars.forEach(a=>{if(a.tx==null||!a.obj.visible)return;const o=a.obj,dx=a.tx-o.position.x,dz=a.tz-o.position.z,dd=Math.hypot(dx,dz);if(dd>.03){o.position.x+=dx*.15;o.position.z+=dz*.15;o.rotation.y=Math.atan2(dx,dz);o.position.y=Math.abs(Math.sin(t*12))*.1}else o.position.y=0});
  OBJ.forEach(m=>{const g=m.userData.grow;if(g){const s=m.scale.x+(g-m.scale.x)*.25;m.scale.setScalar(s);if(Math.abs(g-s)<.01){m.scale.setScalar(g);m.userData.grow=0}}});
  Object.values(NPCOBJ).forEach((g,i)=>{g.userData.mk.position.y=3.35+Math.sin(t*3+i)*.12;g.children[0].scale.y=1.2+Math.sin(t*2+i)*.025});
  CHESTS.forEach((c,i)=>{c.userData.mk.position.y=1.4+Math.sin(t*3+i*2)*.1});
  SIGN.userData.spin.rotation.y=t*1.5;const fp=FLAG.userData.flag.geometry.attributes.position;for(let i=0;i<fp.count;i++){const x=fp.getX(i);fp.setZ(i,Math.sin(x*4+t*5)*.08*(x+.7))}fp.needsUpdate=true;
  const pgr=(t%12)>7.5;if(pgr!==PEDGREEN)setLights(pgr);
  CARS.forEach(c=>{let z=c.g.position.z-CZ;const stop=PEDGREEN&&((c.dir>0&&z>c.cw-3.4&&z<c.cw-1.6)||(c.dir<0&&z<c.cw+3.4&&z>c.cw+1.6));if(!stop){z+=c.dir*c.speed*dt;if(z>24.5)z=-24.5;if(z<-24.5)z=24.5}c.g.position.z=CZ+z});
  WALKERS.forEach(w=>{if(w.pause>0){w.pause-=dt;w.g.position.y=0;return}const tg=w.path[w.i];const dx=CX+tg[0]-w.g.position.x,dz=CZ+tg[1]-w.g.position.z,dd=Math.hypot(dx,dz);
    if(dd<.1)w.i=(w.i+1)%w.path.length;else{const st=Math.min(dd,1.3*dt);w.g.position.x+=dx/dd*st;w.g.position.z+=dz/dd*st;w.g.rotation.y=Math.atan2(dx,dz);w.g.position.y=Math.abs(Math.sin(t*9+w.i))*.08}});
  BOATS.forEach((b,i)=>{b.position.y=Math.sin(t*1.5+i)*.06;b.rotation.z=Math.sin(t*1.2+i)*.05});
  if(P.tour&&ME.zone==='city'&&ME.obj){const tm=NPCOBJ.tom,ry=ME.obj.rotation.y;const bx=ME.pos.x-Math.sin(ry)*1.5,bz=ME.pos.z-Math.cos(ry)*1.5;const dx=bx-tm.position.x,dz=bz-tm.position.z,dd=Math.hypot(dx,dz);
    if(dd>.15){tm.position.x+=dx*.06;tm.position.z+=dz*.06;tm.rotation.y=Math.atan2(dx,dz)}const a=ANCHORS[P.tour.dest];if(a&&Math.hypot(ME.pos.x-CX-a[0],ME.pos.z-CZ-a[1])<5.5)tourDone()}
  water.position.y=-1.6+Math.sin(t*.8)*.05;
  controls.update();renderer.render(scene,camera);requestAnimationFrame(loop)}

/* ===================== BOOT ===================== */
$('#logo').innerHTML='SHAPELAND'.split('').map((c,i)=>`<span style="animation-delay:${i*.12}s;color:${['#FF8FB1','#FFB41F','#64A8FA','#8AD26C','#B49BFA','#FB9A45','#34CDB5','#F57070','#FCD045'][i]}">${c}</span>`).join('');
$('#titleAv').innerHTML=charSVG(P.ch);$('#tName').value=P.name;$('#tCode').value=P.code;
P.pieces.forEach(p=>addPieceObj(p,P.key,'island'));
for(let i=0;i<3;i++)makeChest('island');for(let i=0;i<2;i++)makeChest('town');for(let i=0;i<2;i++)makeChest('city');updatePlotSigns();
renderExteriors();
loop();
</script>
