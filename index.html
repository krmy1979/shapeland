<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shapeland</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Varela+Round&family=Dancing+Script:wght@700&display=swap">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#9FD6FF">
<meta name="description" content="Shapeland · a world by Shirel Yitzhak">
<link rel="stylesheet" href="css/style.css?v=36">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<div id="stage"></div>

<div id="hudTop" class="hud" dir="rtl" hidden>
  <div class="topcol">
    <div class="row" style="gap:8px">
      <button class="chip" data-a="avatar" id="meChip" aria-label="הדמות שלי"></button>
      <button class="gems" data-a="bank" id="gemPill" aria-label="יהלומים"></button>
    </div>
    <button class="loc" data-a="map" id="locChip"></button>
    <div id="questChip"></div>
  </div>
  <div class="friends" id="friends"></div>
</div>

<div id="hudBot" class="hud" dir="rtl" hidden>
  <div class="tray" id="tray" hidden></div>
  <div class="bar" role="toolbar" aria-label="כלים" id="bar"></div>
</div>

<div id="title" dir="rtl">
  <div class="tcard">
    <div class="logo" aria-label="Shapeland" id="logo"></div>
    <div class="sig"><small>a world by</small>Shirel Yitzhak</div>
    <div class="preview" id="titleAv"></div>
    <div class="tform" id="cloudBox" hidden>
      <div id="kidLoginForm" style="display:flex;flex-direction:column;gap:10px">
        <label for="kCode">קוד שחקן (מקבלים מההורים)</label>
        <input class="txt en" id="kCode" dir="ltr" maxlength="12" placeholder="abc123" autocapitalize="none" autocomplete="username" spellcheck="false">
        <label for="kPin">PIN (6 ספרות)</label>
        <input class="txt en" id="kPin" dir="ltr" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password">
        <button class="btn" data-c="kidlogin" style="font-size:22px">כניסה לעולם ✨</button>
        <p class="sub" id="kidMsg" aria-live="polite"></p>
        <p class="sub" id="parentNote" hidden>הדפדפן הזה מחובר כהורה. ילדים נכנסים כאן עם קוד שחקן.</p>
      </div>
      <div id="kidWelcome" hidden style="display:flex;flex-direction:column;gap:10px;text-align:center">
        <h2>שלום <span id="kidHello" dir="auto"></span>! 👋</h2>
        <p class="sub" id="kidGroup"></p>
        <button class="btn" data-c="kidgo" id="kidGo" style="font-size:22px">יאללה, לשחק! ✨</button>
        <button class="btn ghost mini" data-a="avatar">🎨 לעצב את הדמות</button>
      </div>
      <button class="btn ghost mini" data-c="solo">לשחק לבד, בלי חברים</button>
      <a class="sub" href="parent.html" style="text-align:center">🔒 אזור הורים</a>
    </div>
    <div class="tform" id="localBox">
      <label for="tName">איך קוראים לדמות שלך?</label>
      <input class="txt" id="tName" dir="auto" maxlength="14" placeholder="שם במשחק">
      <div class="codewrap" style="display:flex;flex-direction:column;gap:10px">
      <label for="tCode">קוד החבורה (כל מי שמשתמש באותו קוד משחק ביחד)</label>
      <input class="txt en" id="tCode" dir="ltr" maxlength="24" placeholder="shirel-friends" autocapitalize="none" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn" data-a="play" style="font-size:22px">יאללה, לשחק! ✨</button>
      <button class="btn ghost mini" data-a="avatar">🎨 לעצב את הדמות</button>
    </div>
  </div>
</div>

<div id="sheet" class="sheet" dir="rtl" hidden></div>
<div id="toast" class="toast" dir="rtl" hidden></div>
<div id="burst" class="burst" hidden></div>
